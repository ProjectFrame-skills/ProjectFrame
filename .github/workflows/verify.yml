name: Verify ProjectFrame
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.11'
            node: '18'
          - python: '3.13'
            node: '24'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: python3 -m unittest discover -s tests -p test_projectframe.py -v
      - run: npm test
      - run: npm pack --dry-run
      - name: Verify isolated installation and helper startup
        run: |
          node cli/projectframe.mjs install --destination "$RUNNER_TEMP/skills/projectframe"
          python3 "$RUNNER_TEMP/skills/projectframe/scripts/projectframe.py" --help
